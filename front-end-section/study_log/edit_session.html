{% extends 'accounts/base.html' %}

{% block title %}ویرایش جلسه{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-warning">
                <h4 class="mb-0">✏️ ویرایش جلسه: {{ session.subject }}</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    {% for field in form %}
                        <div class="mb-3">
                            <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                            {{ field }}
                            {% for error in field.errors %}
                                <div class="text-danger">{{ error }}</div>
                            {% endfor %}
                        </div>
                    {% endfor %}
                    
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{% url 'study_log:daily_detail' report.id %}" class="btn btn-secondary">🔙 بازگشت</a>
                        <button type="submit" class="btn btn-warning">💾 به‌روزرسانی</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
